<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IFRS S1 &amp; S2 — Maldives 3D Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#032622;--mute:#1f4a43;--acc:#0a5f58;--glass:rgba(255,255,255,.88)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#d7f3ee;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;display:block;cursor:grab}
canvas:active{cursor:grabbing}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-53%);width:min(1120px,calc(100% - 40px));max-height:calc(100vh - 150px);overflow:auto;padding:44px 52px;border-radius:32px;background:rgba(255,255,255,.95);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid #fff;box-shadow:0 30px 80px -20px rgba(7,90,80,.4);transition:opacity .5s,transform .5s}
.card.hide{opacity:0;transform:translate(-50%,-48%);pointer-events:none}
.tag{font:600 .75rem 'Outfit';letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
h1{font:700 clamp(1.8rem,4vw,3rem)/1.1 'Outfit';margin:10px 0}
.sub{color:var(--mute);font-size:1.18rem;line-height:1.55;margin-bottom:24px;max-width:860px}.kb{margin-top:20px;padding:16px 22px;border-radius:16px;border-left:5px solid var(--acc);background:#d3eee6;color:var(--ink);font-size:1.05rem;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.it{background:#f1faf7;border:1px solid #b9e0d6;border-radius:18px;padding:20px 22px;box-shadow:0 4px 16px rgba(13,148,136,.1)}
.it b{display:block;font:600 1.12rem 'Outfit';color:var(--acc);margin-bottom:8px}
.it span{font-size:1.04rem;line-height:1.6;color:var(--ink)}
.nav{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;max-width:calc(100% - 24px)}
button{font:600 .85rem 'Plus Jakarta Sans';border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:#fff;color:var(--ink);border:1px solid #b9e0d6}
button.p{background:linear-gradient(90deg,#047857,#0e7490);color:#fff;border:0}
button.on{background:var(--ink);color:#fff}
.dots{display:flex;gap:6px}
.d{width:8px;height:8px;border-radius:9px;background:#5fa89b;cursor:pointer;transition:.3s}
.d.a{width:24px;background:var(--acc)}
.hint{position:fixed;top:max(20px,env(safe-area-inset-top));right:24px;font-size:.82rem;color:var(--ink);background:var(--glass);padding:8px 14px;border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
@media(max-width:640px){.card{padding:24px 20px;max-height:calc(100vh - 130px)}.d{display:none}.hint{display:none}}
</style></head><body>
<div class="card" id="card"></div>
<div class="hint" id="hint">Drag to look around · click a panel to jump</div>
<div class="nav"><button id="prev">←</button><div class="dots" id="dots"></div><button id="mode">Explore</button><button class="p" id="next">Next →</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const S=[
{t:'Intro',h:'IFRS S1 & S2',s:'Sustainability reporting in the Maldives: what the global standards are, how a report is built, and how the mandatory 2026–2029 rollout works.',i:[['Part 1 · The standards','Who issues S1 and S2, what they cover and who they are written for.'],['Part 2 · The report','How a report is structured and connected to the financials.'],['Part 3 · Maldives rollout','The four mandatory phases and the 3-year grace periods from CA Maldives.']]},
{t:'Who Sets Them',h:'Two boards, one foundation',s:'The IFRS Foundation oversees two standard-setting boards.',i:[['IASB','The International Accounting Standards Board. Writes the IFRS Accounting Standards used for financial statements.'],['ISSB','The International Sustainability Standards Board. Writes the IFRS Sustainability Disclosure Standards, with S1 and S2 as its first two, issued in June 2023.']],k:'The ISSB built S1 and S2 on earlier work, mainly the TCFD climate recommendations and the SASB industry standards.'},
{t:'S1 & S2',h:'What S1 and S2 are',s:'S1 sets the overall rules for every sustainability topic. S2 covers climate change and carbon.',i:[['IFRS S1 · General sustainability','Sustainability issues that could affect cash flow or access to finance: fresh water and reefs for tourism, workforce safety, waste, plus sector topics such as grid reliability for utilities or responsible lending for banks.'],['IFRS S2 · Climate','Physical risks (sea-level rise, erosion, storms, cooling costs), transition risks (diesel to solar, fuel price swings, new laws), and emissions: Scope 1 direct fuel, Scope 2 purchased electricity, Scope 3 the wider supply chain.']],k:'Companies report only what is material: big enough that leaving it out would change a bank’s or investor’s decision.'},
{t:'Financial Focus',h:'The key word is “financial”',s:'The ISSB looks at sustainability only through its effect on the company itself.',i:[['ISSB (S1 & S2)','Asks what sustainability matters could affect the company’s cash flows, access to finance or cost of capital, in the short, medium or long term.'],['EU standards (ESRS)','Go further and also ask how the company affects the planet and society, in addition to how sustainability affects the company.']],k:'Impact on the environment matters under S1 and S2 when it can affect the company’s financial prospects.'},
{t:'Readers & Link',h:'Who reads it, and how it connects',s:'The report is written for capital providers and built to sit alongside the financial reports.',i:[['The readers','Existing and potential investors, banks and other lenders, who use it to make decisions on investing or lending.'],['Same company & period','The same reporting entity and the same 12-month period as the financials, published together.'],['Consistent information','Data and assumptions line up across both, so they read as one connected package.']]},
{t:'Not a Certificate',h:'A reporting rulebook, not a certificate',s:'Companies don’t apply for S1 or S2, and nobody gets “S1 certified”.',i:[['The old way','Voluntary brochures in each company’s own style, so reports couldn’t be compared or tied to the finances.'],['The new baseline','One disclosure standard, read like a balance sheet and comparable across companies and countries.'],['Who decides','Each country chooses whether, and for whom, the standards become mandatory.']],k:'Accounting explains how a business performed last year. S1 & S2 explain how climate and environmental realities may affect its cash flow over the next 5 to 20 years.'},
{t:'Structure',h:'The four building blocks',s:'Whether it’s climate, water or workforce safety, every S1 and S2 report is organized the same way.',i:[['1 · Governance','“Who is watching over this?” Which Board committee or executives oversee risks, and how often they review them.'],['2 · Strategy','“How does this affect our future?” Short, medium and long-term risks and opportunities, plus the transition plan.'],['3 · Risk management','“How do we spot and control risks?” How risks are identified, ranked and built into the risk register.'],['4 · Metrics & targets','“What are our numbers and goals?” Emissions, fuel, electricity, water and safety data, with targets and progress.']],k:'No vague promises: every risk in Strategy must be backed by numbers and goals in Metrics & Targets.'},
{t:'In Practice',h:'Connecting operations to finance',s:'S1 and S2 bring the operations team and the finance team together.',i:[['Step 1 · Operational activity','Diesel in island powerhouses and desalination plants, coastal resorts facing erosion and high cooling loads, or banks lending to tourism and construction.'],['Step 2 · Measurement','Utility bills, fuel receipts and incident reports become standard metrics: Scope 1 from company fuel, Scope 2 from bought electricity, Scope 3 from supplies, travel or loans.'],['Step 3 · Financial link','Finance connects risks and carbon goals to budgets, such as solar capex, fuel savings and insurance costs, all published in the Annual Report.']],k:'The sustainability report covers the same group of companies and the same 12-month period as the audited financials.'},
{t:'Maldives Rollout',h:'Who needs it? Four phases, 2026–2029',s:'CA Maldives adopted IFRS S1 and S2 as the national standard in Aug/Sep 2025.',i:[['Phase 1 · Jan 2026','Main Board listed companies, all banks, financial institutions and insurers, and State-Owned Enterprises with assets over MVR 1 billion. First report: Dec 2026.'],['Phase 2 · Jan 2027','All other State-Owned Enterprises below the MVR 1 billion tier. First report: Dec 2027.'],['Phase 3 · Jan 2028','Companies on the Viyana Board, the second board of the Maldives Stock Exchange. First report: Dec 2028.'],['Phase 4 · Jan 2029','Private companies with over 100 employees AND revenue above MVR 100M or net profit above MVR 20M. First report: Dec 2029.']],k:'Smaller private businesses below the Phase 4 thresholds are exempt, though any company can adopt early.'},
{t:'Grace Periods',h:'The 3-year runway',s:'Introduced October 2026. Every phase gets its own 3-year grace period, starting from the year that group joins.',i:[['Year 1 · Foundation','Climate only, covering the company’s own fuel and electricity. No prior-year comparison needed.'],['Year 2 · Comparison','Still climate only, now compared against the previous year.'],['Year 3 · Broader topics','Add non-climate sustainability topics under IFRS S1.'],['Year 4+ · Full standard','Add supply chain carbon (Scope 3), climate scenarios and financial projections.']],k:'Phase 1 runs 2026 to 2029+, Phase 2 2027 to 2030+, Phase 3 2028 to 2031+, Phase 4 2029 to 2032+.'},
{t:'Yearly Cycle',h:'The annual reporting cycle',s:'Requirements grow as grace periods expire, so reporting becomes part of the normal annual routine.',i:[['1 · Set the foundation','Assign Board oversight and decide which topics are material to finances.'],['2 · Track data','Sites log monthly diesel, electricity, water and waste.'],['3 · Convert to carbon & risk','At year-end, turn logs into emissions, review risks with management and align with finance.'],['4 · Publish & expand','Publish in the Annual Report, then expand as the next stage starts.']]}
];
const N=S.length,card=document.getElementById('card'),dots=document.getElementById('dots');
let cur=0,free=false;
S.forEach((_,i)=>{const d=document.createElement('div');d.className='d';d.onclick=()=>go(i);dots.appendChild(d)});
function render(){
 const s=S[cur];
 card.innerHTML=`<div class="tag">${String(cur+1).padStart(2,'0')} · ${s.t}</div><h1>${s.h}</h1><p class="sub">${s.s}</p><div class="grid">${s.i.map(x=>`<div class="it"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>${s.k?`<div class="kb">${s.k}</div>`:''}`;
 [...dots.children].forEach((d,i)=>d.classList.toggle('a',i===cur));
}
function go(i){cur=(i+N)%N;free=false;sync();render()}
function sync(){card.classList.toggle('hide',free);document.getElementById('mode').classList.toggle('on',free);document.getElementById('mode').textContent=free?'Guided':'Explore';document.getElementById('hint').style.opacity=free?1:0}
prev.onclick=()=>go(cur-1);next.onclick=()=>go(cur+1);
mode.onclick=()=>{free=!free;sync()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft')go(cur-1);else if(e.key==='Escape'||e.key==='e'){free=!free;sync()}});

// ---- 3D ----
const scene=new THREE.Scene();scene.background=new THREE.Color(0xd7f3ee);scene.fog=new THREE.Fog(0xd7f3ee,30,120);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5eead4,.9));
const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(20,30,10);scene.add(sun);

const og=new THREE.PlaneGeometry(240,240,90,90);
const ocean=new THREE.Mesh(og,new THREE.MeshStandardMaterial({color:0x2dd4bf,roughness:.35,metalness:.1,flatShading:true}));
ocean.rotation.x=-Math.PI/2;ocean.position.y=-2;scene.add(ocean);


function island(x,z,r){const g=new THREE.Group();g.position.set(x,0,z);
 const lg=new THREE.Mesh(new THREE.CircleGeometry(r*2,32),new THREE.MeshBasicMaterial({color:0x8ff7e4,transparent:true,opacity:.6}));lg.rotation.x=-Math.PI/2;lg.position.y=-1.3;g.add(lg);
 const sd=new THREE.Mesh(new THREE.CylinderGeometry(r*.9,r*1.3,1.5,20),new THREE.MeshStandardMaterial({color:0xf6e7bf,roughness:1}));sd.position.y=-1.5;g.add(sd);
 const gr=new THREE.Mesh(new THREE.SphereGeometry(r*.65,14,8),new THREE.MeshStandardMaterial({color:0x34d399,roughness:.9}));gr.scale.y=.4;gr.position.y=-.75;g.add(gr);
 for(let k=0;k<3;k++){const a=Math.random()*6.28,d=Math.random()*r*.4,h=2+Math.random()*1.5,p=new THREE.Group();p.position.set(Math.cos(a)*d,-.6,Math.sin(a)*d);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.07,.12,h,6),new THREE.MeshStandardMaterial({color:0x8b5e3c}));tr.position.y=h/2;tr.rotation.z=.15;p.add(tr);
  for(let j=0;j<6;j++){const lf=new THREE.Group();lf.rotation.y=j*1.047;const m=new THREE.Mesh(new THREE.SphereGeometry(.8,6,4),new THREE.MeshStandardMaterial({color:0x15a35a}));m.scale.set(1,.1,.3);m.position.set(.7,0,0);m.rotation.z=-.35;lf.add(m);lf.position.y=h;p.add(lf)}
  g.add(p)}
 scene.add(g)}
[[-30,-8,3.5],[32,14,4.5],[8,-38,5],[-22,30,4],[44,-20,3.2],[-46,-30,5.5],[20,46,3.5],[-10,-52,3],[-55,10,4]].forEach(a=>island(...a));
const R=17,panels=[];
function label(i){
 const c=document.createElement('canvas');c.width=640;c.height=380;const g=c.getContext('2d');
 g.fillStyle='#022c22';g.font='700 150px Outfit, sans-serif';g.textAlign='center';g.fillText(String(i+1).padStart(2,'0'),320,190);
 g.fillStyle='#064e47';g.font='600 46px Outfit, sans-serif';g.fillText(S[i].t,320,270);
 return new THREE.CanvasTexture(c)}
for(let i=0;i<N;i++){
 const a=i/N*Math.PI*2,y=2.5+Math.sin(i*1.3)*1.2;
 const grp=new THREE.Group();grp.position.set(Math.cos(a)*R,y,Math.sin(a)*R);
 const slab=new THREE.Mesh(new THREE.BoxGeometry(7,4.2,.14),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.7,roughness:.1,metalness:.2,emissive:0x2dd4bf,emissiveIntensity:.08}));
 slab.userData.i=i;grp.add(slab);
 grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(slab.geometry),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.9})));
 const tx=new THREE.Mesh(new THREE.PlaneGeometry(6,3.56),new THREE.MeshBasicMaterial({map:label(i),transparent:true}));tx.position.z=.1;grp.add(tx);
 grp.lookAt(0,y,0);grp.userData={y,slab,base:y};scene.add(grp);panels.push(grp)}

const pc=300,pg=new THREE.BufferGeometry(),pp=new Float32Array(pc*3);
for(let i=0;i<pc;i++){pp[i*3]=(Math.random()-.5)*90;pp[i*3+1]=Math.random()*20-1;pp[i*3+2]=(Math.random()-.5)*90}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xffffff,size:.18,transparent:true,opacity:.8}));scene.add(pts);

let yaw=0,pitch=.35,dist=40,drag=false,moved=0,lx=0,ly=0,idle=0;
const pos=new THREE.Vector3(),look=new THREE.Vector3(),tp=new THREE.Vector3(),tl=new THREE.Vector3();
const el=ren.domElement;
el.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;
 if(moved>5&&!free){free=true;sync()}yaw-=dx*.005;pitch=Math.max(.05,Math.min(1.2,pitch+dy*.004));idle=0});
el.addEventListener('pointerup',e=>{drag=false;if(moved<5){
 const m=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),rc=new THREE.Raycaster();rc.setFromCamera(m,cam);
 const h=rc.intersectObjects(panels.map(p=>p.userData.slab))[0];if(h)go(h.object.userData.i)}});
el.addEventListener('wheel',e=>{if(!free){free=true;sync()}dist=Math.max(18,Math.min(70,dist+e.deltaY*.03));e.preventDefault()},{passive:false});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
pos.set(0,10,60);

const clock=new THREE.Clock();
(function loop(){
 requestAnimationFrame(loop);const t=clock.getElapsedTime();
 const v=og.attributes.position;
 for(let i=0;i<v.count;i++){const x=v.getX(i),y=v.getY(i);v.setZ(i,Math.sin(x*.18+t*.8)*.35+Math.cos(y*.14+t*.6)*.3)}
 v.needsUpdate=true;og.computeVertexNormals();
 panels.forEach((p,i)=>{p.position.y=p.userData.base+Math.sin(t*.7+i)*.25;
  const on=i===cur&&!free,s=p.scale.x+((on?1.12:1)-p.scale.x)*.08;p.scale.setScalar(s);
  p.userData.slab.material.emissiveIntensity=on?.35:.08;p.userData.slab.material.opacity=on?.88:.7});
 pts.rotation.y=t*.01;
 if(free){if(!drag){idle+=.016;if(idle>2)yaw+=.0015}
  tp.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist+1,Math.cos(yaw)*Math.cos(pitch)*dist);tl.set(0,3,0)}
 else{const p=panels[cur].position,k=(R-10)/R;tp.set(p.x*k,p.y+1.2,p.z*k);tl.copy(p);
  yaw=Math.atan2(-p.x,-p.z)+Math.PI;}
 pos.lerp(tp,.05);look.lerp(tl,.06);cam.position.copy(pos);cam.lookAt(look);
 ren.render(scene,cam)})();
render();sync();
</script></body></html>
